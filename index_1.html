<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<meta charset="utf-8">
<title>Videographer Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concept: a lime-and-ink film portfolio. A 3D FLEX title assembles on a dark stage, a lime curtain lifts onto a WebGL carousel of reel frames, then each project gets its own full-height, full-quality vertical player that unmasks on scroll. */
:root{
  --bg:#F5F6F0; --bg2:#E8EAE0; --fg:#12130E; --mute:#62665A; --line:#D3D6C8;
  --rec:#D9FF3F; --on:#0C0D08; --night:#0A0B08;
  --f-body:'Readex Pro','Segoe UI',Tahoma,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0B08; --bg2:#151712; --fg:#F2F4EA; --mute:#979C8B; --line:#272A21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0B08; --bg2:#151712; --fg:#F2F4EA; --mute:#979C8B; --line:#272A21; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:1240px;margin-inline:auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.mono{font-family:var(--f-mono);letter-spacing:.05em;font-size:12px;text-transform:uppercase}
.chip{display:inline-block;background:var(--rec);color:var(--on);padding:2px 9px;border-radius:4px}
.pill{font:500 13px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 16px;border-radius:99px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s,border-color .2s,transform .2s}
.pill:hover{border-color:var(--fg)}
.pill.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.lime{background:var(--rec);color:var(--on);border-color:var(--on)}
.pill:active{transform:scale(.97)}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;background:var(--rec);transform-origin:0 50%;transform:scaleX(0);z-index:70}
[dir=rtl] #prog{transform-origin:100% 50%}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:55;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:14px;
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.stuck{border-bottom-color:var(--line)}
.flexlogo{height:32px;width:auto;aspect-ratio:1410/617;display:block}
.flexlogo.sm{height:22px}
.links-n{display:flex;gap:26px}
.links-n a{font-size:14px;text-decoration:none;color:var(--mute);transition:color .2s}
.links-n a:hover{color:var(--fg)}
@media (max-width:820px){.links-n{display:none}}
.nav-r{display:flex;align-items:center;gap:8px}

/* hero */
.hero{position:relative;min-height:min(100svh,980px);display:flex;flex-direction:column;justify-content:space-between;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));overflow:hidden}
#hgl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hero>.wrap{width:100%}
.hero-in{position:relative;z-index:1;padding-top:clamp(28px,7vw,84px)}
.hero .tag{display:flex;gap:12px;align-items:center;color:var(--mute);flex-wrap:wrap}
.hero h1{font-weight:600;font-size:clamp(42px,7.2vw,104px);line-height:.98;letter-spacing:-.04em;margin:20px 0 0;text-wrap:balance;max-width:11.5ch}
[dir=rtl] .hero h1{letter-spacing:0;line-height:1.14;max-width:9ch}
.hero h1 em{font-style:normal;background:var(--rec);color:var(--on);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p.lead{max-width:46ch;color:var(--mute);font-size:clamp(16px,1.5vw,19px);margin:24px 0 0}
.cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.hero-foot{position:relative;z-index:1;padding-block:26px 30px}
@media (max-width:820px){.hero{min-height:auto}#hgl{position:relative;inset:auto;height:52svh;order:2}.hero-in{order:1}.hero-foot{order:3;padding-top:0}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(6px)}
.stat{padding:16px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{padding-inline-start:18px;border-inline-start:1px solid var(--line)}
.stat b{font:600 clamp(24px,3.2vw,40px)/1 var(--f-body);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:13px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){padding-inline-start:0;border-inline-start:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* marquee */
.mq{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));background:var(--rec);color:var(--on);overflow:hidden;white-space:nowrap;border-block:1px solid var(--on)}
.mq-t{display:inline-flex;animation:mq 38s linear infinite;padding-block:14px}
.mq-t span{font:600 clamp(18px,2.6vw,30px)/1 var(--f-body);letter-spacing:-.01em;padding-inline:22px;display:inline-flex;align-items:center;gap:44px}
.mq-t span::after{content:"";width:9px;height:9px;background:var(--on);transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}
[dir=rtl] .mq-t{animation-direction:reverse}

/* section heads */
section{padding-block:clamp(64px,9vw,120px)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:38px}
.sh h2{font-size:clamp(32px,5.4vw,70px);line-height:1.02;letter-spacing:-.035em;margin:12px 0 0;font-weight:600;text-wrap:balance}
[dir=rtl] .sh h2{letter-spacing:0;line-height:1.2}
.sh p{max-width:40ch;color:var(--mute);margin:0}

/* work feed */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:40;padding-block:8px}
.filters .pill[aria-pressed=true]{background:var(--rec);color:var(--on);border-color:var(--on)}
.feed{display:flex;flex-direction:column;gap:clamp(48px,9vw,130px)}
.proj{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,72px);align-items:start}
.proj[hidden]{display:none}
.proj.flip .pm{order:2}.proj.flip .vw{order:1}
.proj.wide{grid-template-columns:minmax(0,4fr) minmax(0,8fr)}
.pm{position:sticky;top:22vh;display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-block:20px;min-width:0}
.pm .idx{color:var(--mute)}
.pm h3{font-size:clamp(28px,3.8vw,56px);line-height:1.03;letter-spacing:-.035em;margin:0;font-weight:600;text-wrap:balance}
[dir=rtl] .pm h3{letter-spacing:0;line-height:1.2}
.pm p{margin:0;color:var(--mute);max-width:34ch}
.pmeta{display:flex;gap:16px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;margin-top:6px;width:100%}
.vw{display:flex;justify-content:center;min-width:0}
.vf{position:relative;height:min(88svh,940px);aspect-ratio:9/16;max-width:100%;border-radius:22px;overflow:hidden;background:var(--bg2);cursor:pointer;
  clip-path:inset(8% 9% round 30px);transition:clip-path 1.2s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.proj.in .vf{clip-path:inset(0 round 22px)}
.vf:hover{box-shadow:0 0 0 3px var(--rec)}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.07);will-change:transform;display:block}
.sweep{position:absolute;inset:0;background:var(--rec);transform:translateY(101%);pointer-events:none}
.proj.in .sweep{animation:sweep 1.15s cubic-bezier(.7,0,.2,1) both}
@keyframes sweep{0%{transform:translateY(101%)}45%{transform:translateY(0)}100%{transform:translateY(-101%)}}
.vtag{position:absolute;top:14px;inset-inline-start:14px;background:rgba(10,11,8,.7);color:#fff;border-radius:99px;padding:5px 12px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px}
.vtag i{width:7px;height:7px;border-radius:50%;background:var(--rec);animation:blink 1.4s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}
.bigplay{position:absolute;bottom:16px;inset-inline-end:16px;width:54px;height:54px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 1.5px var(--on);display:grid;place-items:center;transition:transform .3s}
.vf:hover .bigplay{transform:scale(1.12)}
.bigplay svg{width:18px;height:18px;fill:var(--on);margin-inline-start:3px}
[dir=rtl] .bigplay svg{transform:scaleX(-1);margin-inline-start:0;margin-inline-end:3px}
.proj.wide .vf{aspect-ratio:16/9;height:auto;width:100%}
@media (max-width:860px){
  .proj,.proj.wide{grid-template-columns:1fr;gap:18px}
  .proj.flip .pm,.proj.flip .vw{order:0}
  .pm{position:static;padding-block:0}
  .vf{height:auto;width:min(100%,calc(78svh*9/16))}
  .proj.wide .vf{width:100%}
}


/* bounce transitions between reels */
.proj{position:relative}
.proj.in .vf{animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{0%{transform:translateY(110px) scale(.88) rotate(-2.5deg)}48%{transform:translateY(-22px) scale(1.035) rotate(.8deg)}68%{transform:translateY(9px) scale(.992) rotate(-.3deg)}84%{transform:translateY(-4px) scale(1.004)}100%{transform:none}}
.proj.in .pm>*{animation:popx .9s cubic-bezier(.2,.8,.2,1) both}
.proj.in .pm>*:nth-child(2){animation-delay:.06s}.proj.in .pm>*:nth-child(3){animation-delay:.12s}.proj.in .pm>*:nth-child(4){animation-delay:.18s}.proj.in .pm>*:nth-child(5){animation-delay:.24s}.proj.in .pm>*:nth-child(6){animation-delay:.3s}
@keyframes popx{0%{transform:translateY(46px)}50%{transform:translateY(-9px)}70%{transform:translateY(4px)}100%{transform:none}}
.bdiv{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin-top:clamp(20px,5vw,70px);color:var(--mute);min-height:64px}
.bdiv .ln{flex:1;height:1px;background:var(--line);transform-origin:0 50%}
[dir=rtl] .bdiv .ln{transform-origin:100% 50%}
.bdiv.in .ln{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.bdiv .ball{width:20px;height:20px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 1.5px var(--on);display:block;transform-origin:50% 100%}
.bdiv.in .ball{animation:drop 1.15s cubic-bezier(.3,0,.4,1) both}
@keyframes drop{0%{transform:translateY(-150px) scale(1,1)}38%{transform:translateY(0) scale(1.4,.6)}52%{transform:translateY(-52px) scale(.88,1.12)}66%{transform:translateY(0) scale(1.22,.78)}78%{transform:translateY(-16px) scale(.96,1.04)}88%{transform:translateY(0) scale(1.07,.93)}100%{transform:none}}
.proj.last .bdiv{display:none}
@media (prefers-reduced-motion:reduce){.proj.in .vf,.proj.in .pm>*,.bdiv.in .ln,.bdiv.in .ball{animation:none}}

/* stills */
.stills{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:stretch}
@media (max-width:760px){.stills{grid-template-columns:1fr}}
.still{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.still .ph{border-radius:18px;overflow:hidden;background:var(--bg2);flex:1;min-height:0;position:relative}
.still img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;display:block;will-change:transform}
.still.land .ph{aspect-ratio:3/2}
.still.port .ph{aspect-ratio:2/3}
@media (min-width:761px){.still.land .ph,.still.port .ph{aspect-ratio:auto;height:min(68vh,660px)}}
.still figcaption{color:var(--mute)}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:1px solid var(--line)}
.s{padding:28px 22px 34px;border-bottom:1px solid var(--line);min-width:0;transition:background .3s,color .3s}
.s:hover{background:var(--rec);color:var(--on)}
.s:hover p,.s:hover .mono{color:var(--on)}
.s .mono{color:var(--mute)}
.s h3{font-size:24px;margin:14px 0 8px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.s p{margin:0;color:var(--mute);font-size:15px}

/* contact */
.contact{background:var(--rec);color:var(--on);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.contact .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end}
@media (max-width:760px){.contact .wrap{grid-template-columns:1fr}}
.contact h2{font-size:clamp(36px,7vw,92px);line-height:1;letter-spacing:-.045em;margin:0;font-weight:600;text-wrap:balance}
[dir=rtl] .contact h2{letter-spacing:0;line-height:1.2}
.contact h2 em{font-style:normal;background:var(--on);color:var(--rec);padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.links{display:flex;flex-direction:column;gap:10px}
.link{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 18px;border:1px solid color-mix(in srgb,var(--on) 35%,transparent);border-radius:12px;text-decoration:none;color:var(--on);background:transparent;font:500 15px var(--f-body);cursor:pointer;text-align:start;min-width:0}
.link:hover{background:color-mix(in srgb,var(--on) 10%,transparent)}
.link span:last-child{font-family:var(--f-mono);font-size:13px;opacity:.75;overflow-wrap:anywhere}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:26px;color:var(--mute)}

/* modal */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:80;background:rgba(6,7,5,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
.mbox{position:relative;height:auto;max-width:100%;background:#000;border-radius:16px;overflow:hidden;border:1px solid #2c2f26}
.mbox video{width:100%;height:100%;object-fit:contain;display:block}
.mcap{position:absolute;top:0;inset-inline:0;padding:14px 16px;color:#fff;background:linear-gradient(#000a,transparent);pointer-events:none;display:flex;gap:8px;align-items:center}
.mcap i{width:8px;height:8px;border-radius:50%;background:var(--rec)}
.x{position:fixed;top:max(14px,env(safe-area-inset-top,0px));inset-inline-end:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:#0008;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.mnav{position:fixed;inset-inline:0;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;pointer-events:none}
.mnav .pill{background:#0008;color:#fff;border-color:#ffffff44;pointer-events:auto}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:var(--night);color:#F2F4EA;overflow:hidden}
#igl{position:absolute;inset:0;width:100%;height:100%;display:block}
.i-ui{position:absolute;inset-inline:max(16px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;color:#F2F4EA;transition:opacity .4s}
.i-top{position:absolute;inset-inline:max(16px,env(safe-area-inset-left,0px));top:max(18px,env(safe-area-inset-top,0px));display:flex;justify-content:space-between;color:#979C8B}
.i-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff1a}
.i-bar i{display:block;height:100%;background:var(--rec);transform-origin:0 50%;transform:scaleX(0)}
#iwipe{position:absolute;inset:0;background:var(--rec);clip-path:circle(0% at 50% 50%)}
html.intro-on body{overflow:hidden}
@keyframes rise2{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
html.go .hero-in>*,html.go .hero-foot{animation:rise2 1s cubic-bezier(.2,.7,.2,1) both}
html.go .hero h1{animation-delay:.08s}html.go .hero .lead{animation-delay:.2s}html.go .hero .cta{animation-delay:.3s}html.go .hero-foot{animation-delay:.4s}
@media (prefers-reduced-motion:reduce){#intro{display:none}.mq-t,.vtag i{animation:none}html.go .hero-in>*,html.go .hero-foot{animation:none}html{scroll-behavior:auto}.proj .vf{clip-path:inset(0 round 22px)}.proj .sweep{display:none}}

      vShade=clamp(dot(normalize(normalMatrix*normal),vec3(0.,0.,1.)),0.,1.);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`;
  const frag=`uniform sampler2D map;uniform vec3 uLime;uniform float uDim;varying vec2 vUv;varying float vShade;
    float rr(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
    void main(){vec2 p=(vUv-.5)*vec2(1.,1.7787);float d=rr(p,vec2(.5,.8893),.07);if(d>0.)discard;
      vec3 c=texture2D(map,vUv).rgb;float edge=smoothstep(-.014,-.002,d);
      vec3 col=mix(c,uLime,edge);col*=mix(.28,1.,vShade)*uDim;gl_FragColor=vec4(col,1.);}`;
  const N=HERO_KEYS.length,R=3.2,mats=[],loads=[];
  HERO_KEYS.forEach((k,i)=>{
    const m=new THREE.ShaderMaterial({vertexShader:vert,fragmentShader:frag,side:THREE.DoubleSide,
      uniforms:{map:{value:null},uLime:{value:new THREE.Color(0xD9FF3F)},uBend:{value:0},uTime:{value:0},uDim:{value:1}}});
    loads.push(new Promise(res=>loader.load(''+k+'.jpg',t=>{t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;m.uniforms.map.value=t;res()},undefined,()=>res())));
    const mesh=new THREE.Mesh(geo,m),a=i/N*Math.PI*2;
    mesh.position.set(Math.sin(a)*R,Math.sin(a*2.0)*.55,Math.cos(a)*R);
    mesh.rotation.y=a;mesh.rotation.z=Math.sin(a*3)*.05;
    group.add(mesh);mats.push(m);
  });
  /* lime dust */
  const PN=260,pp=new Float32Array(PN*3),pv=new Float32Array(PN);
  for(let i=0;i<PN;i++){pp[i*3]=(Math.random()-.5)*16;pp[i*3+1]=(Math.random()-.5)*10;pp[i*3+2]=(Math.random()-.5)*10;pv[i]=.2+Math.random()*.6}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xD9FF3F,size:.035,transparent:true,opacity:.75,depthWrite:false}));
  scene.add(dust);
  let W_=0,H_=0,mx=0,my=0,tmx=0,tmy=0,t=0,inView=true,sv=0,lastS=scrollY,running=false;
  function size(){
    const r=canvas.getBoundingClientRect();W_=Math.max(1,r.width);H_=Math.max(1,r.height);
    renderer.setSize(W_,H_,false);camera.aspect=W_/H_;
    const wide=camera.aspect>1.1;
    camera.position.set(0,.2,wide?12.2:13.2);
    group.position.set(wide?Math.min(5.0,2.0+camera.aspect*1.7):0,0,0);
    const s=wide?1:.92;group.scale.setScalar(s);
    camera.updateProjectionMatrix();
  }
  size();addEventListener('resize',size);
  addEventListener('pointermove',e=>{tmx=(e.clientX/innerWidth-.5)*2;tmy=(e.clientY/innerHeight-.5)*2},{passive:true});
  new IntersectionObserver(es=>{inView=es[0].isIntersecting;if(inView&&hero.active)loop()}).observe($('#top'));
  function frame(){
    t+=.016;
    const s=scrollY,dv=s-lastS;lastS=s;sv+=(Math.max(-1,Math.min(1,dv/40))-sv)*.12;
    mx+=(tmx-mx)*.05;my+=(tmy-my)*.05;
    group.rotation.y=t*.16+s*.0022+mx*.25;
    group.rotation.x=-.1+my*.1;group.rotation.z=.06;
    const bend=sv*.9;
    mats.forEach(m=>{m.uniforms.uBend.value=bend;m.uniforms.uTime.value=t});
    const pa=pg.attributes.position.array;
    for(let i=0;i<PN;i++){pa[i*3+1]+=pv[i]*.004+Math.abs(sv)*.03;if(pa[i*3+1]>5)pa[i*3+1]=-5}
    pg.attributes.position.needsUpdate=true;
    dust.rotation.y=-t*.02;
    renderer.render(scene,camera);
  }
  function loop(){
    if(running)return;running=true;
    (function tick(){if(!inView||!hero.active||document.hidden){running=false;return}frame();requestAnimationFrame(tick)})();
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&inView&&hero.active)loop()});
  hero.ready=Promise.race([Promise.all(loads),new Promise(r=>setTimeout(r,3500))]);
  hero.start=()=>{hero.active=true;if(reduce){frame()}else loop()};
})()}

/* ---- intro: the FLEX title assembles in 3D, then a lime curtain lifts onto the page ---- */
(function runIntro(){
  const root=document.documentElement,intro=$('#intro');
  function finishNow(){intro.remove();root.classList.remove('intro-on');root.classList.add('go');hero.start();countUp()}
  if(!THREE_OK||reduce){finishNow();return}
  let renderer;
  try{renderer=new THREE.WebGLRenderer({canvas:$('#igl'),antialias:true})}catch(e){finishNow();return}
  root.classList.add('intro-on');
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setClearColor(0x0A0B08,1);
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,200);
  const rig=new THREE.Group();scene.add(rig);

  /* --- parse the traced FLEX paths into extruded shapes --- */
  function sub(d){
    const tk=d.match(/[MLCZ]|-?\d*\.?\d+/g),out=[];let cur=null,px=0,py=0,i=0;
    while(i<tk.length){const c=tk[i++];
      if(c==='M'){px=+tk[i++];py=+tk[i++];cur=[[px,py]];out.push(cur)}
      else if(c==='L'){px=+tk[i++];py=+tk[i++];cur.push([px,py])}
      else if(c==='C'){const x1=+tk[i++],y1=+tk[i++],x2=+tk[i++],y2=+tk[i++],x=+tk[i++],y=+tk[i++];
        for(let s=1;s<=5;s++){const t=s/5,u=1-t;cur.push([u*u*u*px+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x,u*u*u*py+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y])}px=x;py=y}
    }
    return out;
  }
  const area=p=>{let a=0;for(let i=0,n=p.length;i<n;i++){const q=p[(i+1)%n];a+=p[i][0]*q[1]-q[0]*p[i][1]}return a/2};
  const inside=(pt,p)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if((p[i][1]>pt[1])!==(p[j][1]>pt[1])&&pt[0]<(p[j][0]-p[i][0])*(pt[1]-p[i][1])/(p[j][1]-p[i][1])+p[i][0])c=!c}return c};
  const CX=1086,CY=763.5,S=139.4;
  const norm=p=>p.map(q=>new THREE.Vector2((q[0]-CX)/S,-(q[1]-CY)/S));
  function build(d,mat){
    const polys=sub(d).filter(p=>p.length>3&&Math.abs(area(p))>900).map(p=>({p,a:Math.abs(area(p))}));
    polys.forEach(o=>{
      const containers=polys.filter(q=>q!==o&&q.a>o.a&&inside(o.p[0],q.p));
      o.depth=containers.length;o.parent=containers.sort((x,y)=>x.a-y.a)[0];
    });
    const meshes=[];
    polys.filter(o=>o.depth%2===0).forEach(o=>{
      const sh=new THREE.Shape(norm(o.p));
      polys.filter(h=>h.depth%2===1&&h.parent===o).forEach(h=>sh.holes.push(new THREE.Path(norm(h.p))));
      const g=new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:true,bevelThickness:.05,bevelSize:.035,bevelSegments:2,steps:1});
      g.translate(0,0,-.25);g.computeBoundingBox();
      const m=new THREE.Mesh(g,mat);
      const c=new THREE.Vector3();g.boundingBox.getCenter(c);m.userData.c=c;
      meshes.push(m);
    });
    return meshes;
  }
  const white=new THREE.MeshStandardMaterial({color:0xF2F4EA,metalness:.25,roughness:.34,transparent:true});
  const lime=new THREE.MeshStandardMaterial({color:0xD9FF3F,metalness:.15,roughness:.4,emissive:0xD9FF3F,emissiveIntensity:.28,transparent:true});
  const pieces=[...build($('#fw').getAttribute('d'),white),...build($('#fl').getAttribute('d'),lime)];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  pieces.forEach((m,i)=>{
    const c=m.userData.c;
    m.userData.delay=(c.x+5)/10*.5+Math.random()*.18;
    m.userData.from={pos:new THREE.Vector3(c.x*rnd(.2,1.4)+rnd(-3,3),c.y*rnd(.2,1.4)+rnd(-4,4),rnd(14,34)),rot:new THREE.Euler(rnd(-2.2,2.2),rnd(-2.2,2.2),rnd(-1.4,1.4))};
    m.visible=false;rig.add(m);
  });
  /* lights */
  scene.add(new THREE.AmbientLight(0xffffff,.55));
  const key=new THREE.DirectionalLight(0xffffff,1.05);key.position.set(-4,6,9);scene.add(key);
  const sweep=new THREE.PointLight(0xD9FF3F,2.2,26);sweep.position.set(-14,2,5);scene.add(sweep);
  const rim=new THREE.PointLight(0xffffff,.9,40);rim.position.set(8,-5,6);scene.add(rim);
  /* dust */
  const PN=320,pp=new Float32Array(PN*3);
  for(let i=0;i<PN;i++){pp[i*3]=rnd(-18,18);pp[i*3+1]=rnd(-9,9);pp[i*3+2]=rnd(-12,10)}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0xD9FF3F,size:.05,transparent:true,opacity:.6,depthWrite:false}));scene.add(dust);

  let z0=16;
  function size(){
    const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
    const fit=11.5/(2*Math.tan(THREE.MathUtils.degToRad(17.5))*camera.aspect);
    z0=Math.max(15,fit);camera.updateProjectionMatrix();
  }
  size();addEventListener('resize',size);

  const ease=t=>1-Math.pow(1-t,4),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const T_LOAD=.75,T_ASM=1.0,T_EXIT=2.9,T_WIPE=3.2;
  let t0=null,wiping=false,over=false,heroReady=false;
  hero.ready.then(()=>heroReady=true);
  const ipct=$('#ipct'),ibar=$('#ibar'),ui=intro.querySelector('.i-ui');
  const target=new THREE.Vector3(2.97,-.33,0);
  let skipAt=null;
  function skip(){if(t0!==null&&!wiping&&skipAt===null)skipAt=(performance.now()-t0)/1000}
  intro.addEventListener('click',skip);addEventListener('keydown',e=>{if(e.key==='Escape'&&!over)skip()});

  function startWipe(){
    wiping=true;
    const w=$('#iwipe');
    const a=w.animate([{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(150% at 50% 50%)'}],{duration:750,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});
    a.onfinish=()=>{
      renderer.dispose();$('#igl').style.display='none';ui.style.opacity=0;
      root.classList.add('go');hero.start();countUp();
      const c=intro.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],{duration:850,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});
      c.onfinish=()=>{over=true;intro.remove();root.classList.remove('intro-on')};
    };
  }
  function frame(now){
    if(over)return;
    if(t0===null)t0=now;
    let t=(now-t0)/1000;
    if(skipAt!==null&&t<skipAt+.05)t=Math.max(t,T_EXIT+.2);
    if(skipAt!==null&&t<T_EXIT)t=T_EXIT+.2;
    /* loading counter */
    const lp=cl(t/T_LOAD);ipct.textContent=String(Math.round(lp*100)).padStart(3,'0');ibar.style.transform=`scaleX(${lp})`;
    /* assemble */
    pieces.forEach(m=>{
      const p=cl((t-T_ASM-m.userData.delay)/.95);
      if(p<=0){m.visible=false;return}
      m.visible=true;const e=ease(p),f=m.userData.from,c=m.userData.c;
      m.position.set(f.pos.x*(1-e),f.pos.y*(1-e),f.pos.z*(1-e));
      m.rotation.set(f.rot.x*(1-e),f.rot.y*(1-e),f.rot.z*(1-e));
      m.material.opacity=cl(p*2.2);
      m.scale.setScalar(.55+.45*e);
    });
    /* camera + light */
    const dolly=eio(cl(t/3));
    let zc=z0*(1.22-.22*dolly);
    const settle=cl((t-T_ASM)/1.6);
    rig.rotation.y=Math.sin(t*.9)*.16*(1-settle*.4);rig.rotation.x=Math.sin(t*.7)*.05;
    sweep.position.x=-14+28*eio(cl((t-1.2)/1.7));sweep.position.y=2+Math.sin(t*2)*1.5;
    if(t>T_EXIT){
      const e=eio(cl((t-T_EXIT)/.95));
      camera.position.set(target.x*e,target.y*e,zc*(1-e)+2.4*e);
      camera.lookAt(target.x*e,target.y*e,0);
      rig.rotation.y*=1-e;
    }else{camera.position.set(0,0,zc);camera.lookAt(0,0,0)}
    dust.rotation.y=t*.05;dust.position.z=t*.6;
    renderer.render(scene,camera);
    if(t>=T_WIPE&&!wiping&&(heroReady||t>7)){startWipe()}
    if(!over&&!(wiping&&t>12))requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
